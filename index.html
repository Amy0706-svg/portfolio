<style>
/* Layout: quiet dark gallery. Wordmark top-left, index grid of film frames, detail pages read like a production sheet. */
:root {
  --bg: #121110;
  --surface: #1b1a18;
  --fg: #ece8e1;
  --muted: #8f8a81;
  --line: #2c2a27;
  --accent: #c9a46a;
  --frame-ink: #f4efe6;
  --font-display: "Syne", "Noto Sans TC", system-ui, sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --wrap: 1180px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f3f1; --surface: #e8e7e3; --fg: #171614; --muted: #6c6862;
    --line: #d9d7d2; --accent: #86652f; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f3f1; --surface: #e8e7e3; --fg: #171614; --muted: #6c6862;
  --line: #d9d7d2; --accent: #86652f; color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  transition: background .3s, color .3s;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 3px; }

.wrap {
  max-width: calc(var(--wrap) + 64px); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 720px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

/* header */
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 36px; }
.mark { display: flex; align-items: center; gap: 12px; }
.mark-box {
  width: 34px; height: 34px; border: 1.5px solid currentColor; border-radius: 3px;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 15px;
}
.mark-text { display: grid; line-height: 1.15; }
.mark-text strong { font-family: var(--font-display); font-weight: 500; font-size: 19px; letter-spacing: .06em; }
.mark-text small { font-size: 10px; letter-spacing: .28em; color: var(--muted); }
nav { display: flex; align-items: center; gap: 28px; font-size: 13px; letter-spacing: .12em; }
nav a { color: var(--muted); transition: color .2s; }
nav a:hover, nav a[aria-current="page"] { color: var(--fg); }
.theme-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.theme-btn:hover { color: var(--fg); }
.theme-btn svg { width: 16px; height: 16px; }
@media (max-width: 560px) { nav { gap: 18px; } .mark-text small { display: none; } }

/* page head */
.eyebrow { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); display: flex; gap: 18px; flex-wrap: wrap; }
.eyebrow b { color: var(--fg); font-weight: 500; }
.page-head { padding-block: 64px 36px; display: grid; gap: 18px; }
h1 { font-size: clamp(24px, 3.2vw, 30px); font-weight: 500; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; max-width: 62ch; display: grid; gap: 6px; }
.lede p { margin: 0; }
.lede p:first-child { color: var(--fg); font-size: 16px; }
.list-head { display: flex; align-items: baseline; gap: 12px; border-top: 1px solid var(--line); padding-top: 28px; margin-bottom: 18px; }
.list-head h2 { margin: 0; font-size: 13px; letter-spacing: .24em; font-weight: 700; }
.list-head .tc { color: var(--muted); }
/* shots: frames the viewer can trust were shot by Amy */
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 32px 24px; }
.shots figure { margin: 0; display: grid; gap: 12px; align-content: start; }
.shots .frame.vert { max-width: 260px; }
.shots .badge.kind { font-size: 10px; }
.shots dl { margin: 0; display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 4px 14px; font-size: 13px; }
.shots dt { color: var(--muted); }
.shots dd { margin: 0; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 6px 26px; padding-bottom: 40px; font-size: 13px; letter-spacing: .06em; }
.filters button { color: var(--muted); padding-block: 4px; border-bottom: 1px solid transparent; transition: color .2s, border-color .2s; }
.filters button:hover { color: var(--fg); }
.filters button[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }
.filters .n { font-family: var(--font-mono); font-size: 11px; margin-left: 6px; color: var(--muted); }

/* grid */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 60px 44px; padding-bottom: 120px; }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 52px 28px; } }
@media (max-width: 620px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 44px; } }
.card { display: grid; gap: 16px; align-content: start; min-width: 0; }
.card .frame img { transition: transform .6s ease, filter .4s; }
.card:hover .frame img { transform: scale(1.03); filter: brightness(1.08); }
.card:hover .frame .play { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.meta-line { font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.meta-line .yr, .tc { font-family: var(--font-mono); font-size: 12px; letter-spacing: .02em; }
.card h2 { font-size: 16px; font-weight: 500; margin: 4px 0 0; line-height: 1.6; text-wrap: pretty; }
.card:hover h2 { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
.empty { color: var(--muted); padding-block: 40px 140px; }

/* frames */
.frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; background: var(--surface); }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.frame.vert { aspect-ratio: 9 / 16; }
.play {
  position: absolute; left: 50%; top: 50%; z-index: 3; width: 56px; height: 56px; border-radius: 50%;
  border: 1.5px solid var(--frame-ink); display: grid; place-items: center; color: var(--frame-ink);
  background: rgb(0 0 0 / .3); backdrop-filter: blur(3px);
  opacity: 0; transform: translate(-50%, -50%) scale(.9); transition: opacity .3s, transform .3s;
}
.play svg { width: 18px; height: 18px; margin-left: 3px; }
.badge { position: absolute; z-index: 2; font-family: var(--font-mono); font-size: 11px; color: var(--frame-ink); text-shadow: 0 1px 6px rgb(0 0 0 / .6); }
.badge.dur { right: 12px; bottom: 10px; }
.badge.kind { left: 12px; top: 10px; font-family: var(--font-body); font-size: 10px; letter-spacing: .2em; }

/* detail */
.back { display: inline-flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); letter-spacing: .06em; padding-top: 24px; }
.back:hover { color: var(--fg); }
.hero { margin-top: 28px; display: grid; gap: 12px; }
.hero .frame .play { opacity: 1; transform: translate(-50%, -50%) scale(1); width: 76px; height: 76px; }
.hero button.frame { width: 100%; padding: 0; cursor: pointer; }
.hero button.frame:hover img { filter: brightness(1.08); }
.hero iframe, .hero video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
.hero .player { background: #000; }
.hero a.frame:hover img { filter: brightness(1.08); }
.badge.yt { left: 50%; bottom: 14px; transform: translateX(-50%); font-family: var(--font-body); font-size: 12px; letter-spacing: .06em; }
.split { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 56px; align-items: start; }
.split .detail { padding-top: 28px; }
@media (max-width: 860px) { .split { grid-template-columns: minmax(0, 1fr); gap: 0; } .split .hero { max-width: 380px; width: 100%; margin-inline: auto; } .split .detail { padding-top: 44px; } }
.versions a { border-bottom: 1px solid var(--muted); }
.versions a:hover { border-color: var(--fg); }
.hero-meta { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.hero-meta a { border-bottom: 1px solid var(--muted); }
.hero-meta a:hover { color: var(--fg); border-color: var(--fg); }
.detail { display: grid; gap: 28px; padding-block: 52px 40px; max-width: 780px; }
.detail h1 { font-size: clamp(22px, 2.8vw, 28px); }
.facts { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 6px 24px; margin: 0; font-size: 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; }
.facts .tags { display: flex; gap: 14px; flex-wrap: wrap; }
.facts .tags button { border-bottom: 1px solid var(--muted); }
.facts .tags button:hover { border-color: var(--fg); }
.summary { margin: 0; max-width: 62ch; font-size: 15.5px; line-height: 1.95; }
.rights { margin: 0; font-size: 12.5px; color: var(--muted); max-width: 62ch; }
.versions { list-style: none; margin: 0; padding: 0; max-width: 780px; }
.versions li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; padding-block: 12px; border-top: 1px solid var(--line); font-size: 14px; }
.versions li:last-child { border-bottom: 1px solid var(--line); }
.versions li span:last-child { color: var(--muted); }
.block-h { margin: 0 0 16px; font-size: 13px; letter-spacing: .24em; font-weight: 700; }
.section { padding-bottom: 44px; }
.stills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.stills.vert { max-width: 760px; }
@media (max-width: 620px) { .stills:not(.vert) { grid-template-columns: minmax(0, 1fr); } .stills.vert { gap: 8px; } }
.photos { columns: 3 260px; column-gap: 16px; }
.photos .frame { break-inside: avoid; margin-bottom: 16px; aspect-ratio: auto; }
.photos .frame img { height: auto; }
.note { border-top: 1px solid var(--line); padding-top: 34px; max-width: 780px; display: grid; gap: 14px; margin-bottom: 40px; }
.note h3 { margin: 0; font-size: 13px; letter-spacing: .24em; font-weight: 700; }
.note p { margin: 0; max-width: 62ch; opacity: .9; line-height: 1.95; }
blockquote { margin: 0 0 44px; padding: 4px 0 4px 22px; border-left: 2px solid var(--accent); max-width: 760px; }
blockquote p { margin: 0; font-size: clamp(17px, 2vw, 20px); line-height: 1.8; text-wrap: pretty; }
blockquote footer { margin-top: 10px; font-size: 13px; color: var(--muted); }
.pager { border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding-block: 36px 110px; margin-top: 20px; }
.pager a { display: grid; gap: 4px; min-width: 0; }
.pager a:last-child { text-align: right; }
.pager small { font-size: 11px; letter-spacing: .22em; color: var(--muted); }
.pager span { font-size: 14px; }
.pager a:hover span { text-decoration: underline; text-underline-offset: 4px; }

/* about */
.about { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 72px; padding-bottom: 120px; }
@media (max-width: 860px) { .about { grid-template-columns: minmax(0, 1fr); gap: 48px; } }
.about .lead { font-size: clamp(20px, 2.4vw, 26px); line-height: 1.6; margin: 0; text-wrap: balance; }
.about section { display: grid; gap: 14px; }
.about section + section { margin-top: 44px; }
.about h3 { margin: 0; font-size: 11px; letter-spacing: .28em; color: var(--muted); font-weight: 500; }
.about p { margin: 0; max-width: 58ch; }
.rows { list-style: none; padding: 0; margin: 0; display: grid; }
.rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; border-top: 1px solid var(--line); padding-block: 13px; }
.rows li:last-child { border-bottom: 1px solid var(--line); }
.rows li span { color: var(--muted); font-size: 13px; text-align: right; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 8px; counter-increment: s; }
.steps li::before { content: counter(s, decimal-leading-zero); font-family: var(--font-mono); font-size: 12px; color: var(--accent); padding-top: 3px; }
.steps b { font-weight: 500; }
.steps small { display: block; color: var(--muted); font-size: 13px; }
.skills { font-size: 14px; color: var(--muted); line-height: 2; }
.contact { display: grid; margin: 0; }
.contact-row { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 10px; border-top: 1px solid var(--line); }
.contact-row:last-child { border-bottom: 1px solid var(--line); }
.contact-row dt { color: var(--muted); font-size: 13px; }
.contact-row dd { margin: 0; overflow-wrap: anywhere; }
.contact-row dd a:hover { text-decoration: underline; text-underline-offset: 4px; }
.copy { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.copy:hover { color: var(--fg); }
.hint { font-size: 13px; color: var(--muted); }

footer.site { border-top: 1px solid var(--line); }
footer.site .wrap { display: flex; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap; padding-block: 28px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }

#view { animation: fade .45s ease both; }
@keyframes fade { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #view { animation: none; } * { transition: none !important; } }
</style>
</head>

<script>
/* ============================================================
   下面是網站運作的程式，一般不需要修改
   ============================================================ */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const view = document.getElementById("view");
const PLAY = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9.5-5.5z"/></svg>';
/* 預覽頁（被嵌在別的頁面裡）不能嵌入 YouTube，改成開新分頁播放；架在自己網站上就直接嵌入 */
const CAN_EMBED = (() => { try { return window.self === window.top; } catch (e) { return false; } })();
const sorted = () => WORKS.map((w, i) => [w, i]).sort((a, b) => ((b[0].year || 0) - (a[0].year || 0)) || (a[1] - b[1])).map(x => x[0]);
let filter = "all";

function card(w) {
  const vid = w.type === "video";
  return `<a class="card" href="#w-${esc(w.id)}">
    <div class="frame">
      <img src="${esc(w.cover)}" alt="${esc(w.title)}" loading="lazy">
      ${vid ? `<span class="play">${PLAY}</span>` : `<span class="badge kind">PHOTO · ${(w.images || []).length}</span>`}
      ${w.vertical ? `<span class="badge kind">9:16</span>` : ""}
      ${w.duration ? `<span class="badge dur">${esc(w.duration)}</span>` : ""}
    </div>
    <div>
      <div class="meta-line">${w.year ? `<span class="yr">${w.year}</span>` : ""}<span>${esc(w.client)}</span></div>
      <h2>${esc(w.title)}</h2>
    </div>
  </a>`;
}

function renderIndex() {
  const groups = [["all", "全部"], ...TAGS.map(t => [t, t])];
  const list = sorted().filter(w => filter === "all" || (w.tags || []).includes(filter));
  view.innerHTML = `
    <div class="page-head">
      <div class="eyebrow"><span>${esc(SITE.name)}</span><b>INDEX</b></div>
      <h1>${esc(SITE.headline)}</h1>
      <div class="lede">${SITE.intro.map(t => `<p>${esc(t)}</p>`).join("")}</div>
    </div>
    <div class="list-head"><h2>全部作品</h2><span class="tc">${WORKS.length}</span>
    </div>
    <div class="filters" role="group" aria-label="依分類篩選作品">
      ${groups.map(([k, label]) => {
        const n = k === "all" ? WORKS.length : WORKS.filter(w => (w.tags || []).includes(k)).length;
        return n ? `<button type="button" data-filter="${esc(k)}" aria-pressed="${filter === k}">${esc(label)}<span class="n">${n}</span></button>` : "";
      }).join("")}
    </div>
    ${list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<p class="empty">這個分類還沒有作品。</p>`}
  `;
  view.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => setFilter(b.dataset.filter, false)));
}

function setFilter(f, go) {
  filter = f;
  try { sessionStorage.setItem("pf-filter", filter); } catch (e) {}
  if (go && location.hash) { location.hash = ""; } else { renderIndex(); }
}

function renderWork(w) {
  const list = sorted();
  const i = list.indexOf(w);
  const prev = list[i - 1], next = list[i + 1];
  const vid = w.type === "video";

  let hero = "";
  const durMeta = w.duration ? `<span>片長 <span class="tc">${esc(w.duration)}</span></span>` : "<span></span>";
  if (vid && w.video) {
    hero = `<div class="frame player${w.vertical ? " vert" : ""}">
        <video controls playsinline preload="metadata" poster="${esc(w.poster || w.cover)}"><source src="${esc(w.video)}" type="video/mp4">你的瀏覽器無法播放這支影片。</video>
      </div>
      <div class="hero-meta">${durMeta}</div>`;
  } else if (vid && w.youtube) {
    const ytUrl = `https://www.youtube.com/watch?v=${esc(w.youtube)}`;
    hero = (CAN_EMBED
      ? `<button type="button" class="frame" id="yt-play" aria-label="播放影片"><img src="${esc(w.cover)}" alt="${esc(w.title)}"><span class="play">${PLAY}</span></button>`
      : `<a class="frame" href="${ytUrl}" target="_blank" rel="noopener" aria-label="在 YouTube 播放"><img src="${esc(w.cover)}" alt="${esc(w.title)}"><span class="play">${PLAY}</span><span class="badge yt">在 YouTube 播放 ↗</span></a>`)
      + `<div class="hero-meta">${durMeta}<a href="${ytUrl}" target="_blank" rel="noopener">在 YouTube 觀看 ↗</a></div>`;
  }

  const facts = [
    ["年份", w.year ? `<span class="tc">${w.year}</span>` : ""],
    ["委託／單位", esc(w.client)],
    ["我負責", esc(w.role)],
    ["規格", w.spec ? `<span class="tc">${esc(w.spec)}</span>` : ""],
    ["片長", vid && w.duration ? `<span class="tc">${esc(w.duration)}</span>` : ""],
    ["張數", !vid && w.images ? `<span class="tc">${w.images.length}</span> 張精選` : ""]
  ].filter(f => f[1]);

  const stills = w.stills ? `<div class="section"><h3 class="block-h">畫面</h3>
      <div class="stills${w.stillsVertical ? " vert" : ""}">${w.stills.map(s =>
        `<div class="frame${w.stillsVertical ? " vert" : ""}"><img src="${esc(s)}" alt="" loading="lazy"></div>`).join("")}</div></div>` : "";

  const photos = !vid && w.images ? `<div class="section photos">${w.images.map((s, k) =>
      `<div class="frame"><img src="${esc(s)}" alt="${esc(w.title)} ${k + 1}" loading="lazy"></div>`).join("")}</div>` : "";

  const versions = w.versions ? `<div class="section"><h3 class="block-h">${w.vertical ? "其他版本" : "交付版本"}</h3><ul class="versions">${w.versions.map(([l, d, link]) =>
      `<li><span>${link ? `<a href="#w-${esc(link)}">${esc(l)} →</a>` : esc(l)}</span><span class="tc">${esc(d)}</span></li>`).join("")}</ul></div>` : "";

  view.innerHTML = `
    <a class="back" href="#">← 全部作品</a>
    <div class="${w.vertical ? "split" : ""}">
    ${hero ? `<div class="hero">${hero}</div>` : ""}
    <article class="detail">
      <div class="eyebrow"><span>${vid ? "FILM" : "PHOTOGRAPHY"}</span><b>${w.year || "WORK"}</b></div>
      <h1>${esc(w.title)}</h1>
      <dl class="facts">
        ${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}
        <dt>分類</dt><dd class="tags">${(w.tags || []).map(t => `<button type="button" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}</dd>
      </dl>
      <p class="summary">${esc(w.summary)}</p>
      ${w.rights ? `<p class="rights">${esc(w.rights)}</p>` : ""}
    </article>
    </div>
    ${w.quote ? `<blockquote><p>「${esc(w.quote.text)}」</p><footer>${esc(w.quote.by)}</footer></blockquote>` : ""}
    ${photos}
    ${versions}
    ${stills}
    ${w.shots && w.shots.length ? `<div class="section"><h3 class="block-h">拍攝現場｜我拍的鏡頭</h3><div class="shots">${w.shots.map(sh => `<figure>
        <div class="frame${sh.vertical ? " vert" : ""}"><img src="${esc(sh.src)}" alt="${esc(sh.label || "拍攝影格")}" loading="lazy"><span class="badge kind">${sh.bts ? "幕後" : "我拍的鏡頭"}</span></div>
        <dl>${[["鏡頭", sh.label], ["器材", sh.gear], ["鏡位・光線", sh.setup], ["現場限制", sh.challenge], ["怎麼處理", sh.solution]].filter(r => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      </figure>`).join("")}</div></div>` : ""}
    ${(w.notes || []).map(n => `<section class="note"><h3>${esc(n.h)}</h3>${n.p.map(p => `<p>${esc(p)}</p>`).join("")}</section>`).join("")}
    <nav class="pager" aria-label="上一件與下一件作品">
      ${prev ? `<a href="#w-${esc(prev.id)}"><small>上一件</small><span>${esc(prev.title)}</span></a>` : "<span></span>"}
      ${next ? `<a href="#w-${esc(next.id)}"><small>下一件</small><span>${esc(next.title)}</span></a>` : "<span></span>"}
    </nav>
  `;
  const yt = document.getElementById("yt-play");
  if (yt) yt.addEventListener("click", () => {
    const box = document.createElement("div");
    box.className = "frame";
    box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(w.youtube)}?autoplay=1&rel=0" title="${esc(w.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    yt.replaceWith(box);
  });
  view.querySelectorAll("[data-tag]").forEach(b => b.addEventListener("click", () => setFilter(b.dataset.tag, true)));
}

function renderAbout() {
  const contacts = [
    ["Email", SITE.email, `mailto:${SITE.email}`],
    ["Instagram", SITE.instagram.label, SITE.instagram.url],
    ["YouTube", SITE.youtube.label, SITE.youtube.url]
  ];
  view.innerHTML = `
    <div class="page-head">
      <div class="eyebrow"><span>${esc(SITE.name)}</span><b>ABOUT</b></div>
      <h1>關於我</h1>
    </div>
    <div class="about">
      <div>
        <section>
          <p class="lead">讓土地與職人的故事被看見。</p>
          <p>我是黃千瑜 Amy，數位多媒體設計系畢業，有 8 年以上品牌設計與影音製作經驗。在品牌端擔任美編企劃時開始拍農友訪談、活動紀錄和形象影片，2025 年起以影像創作者的身分接案。</p>
          <p>我習慣用乾淨、紀實、有溫度的影像語言說故事，再用設計背景把字卡、版面和社群規格整理好，讓影片拿到就能用。</p>
        </section>
        <section>
          <h3>我的做法</h3>
          <ul class="rows">
            <li>清楚敘事<span>先剪清楚主軸和觀眾路徑，再做節奏與情緒</span></li>
            <li>可交付版本<span>依平台與用途輸出 16:9、9:16、1:1</span></li>
            <li>穩定溝通<span>清單化回饋與里程碑，降低修改成本</span></li>
          </ul>
        </section>
        <section>
          <h3>工具與能力</h3>
          <p class="skills">腳本企劃 · 分鏡 · 現場拍攝 · 剪接 · 調光 · 字幕與字卡 · 空拍（DJI Air 2S）· Podcast 剪輯 · 平面設計（Photoshop、Illustrator）</p>
        </section>
      </div>
      <div>
        <section>
          <h3>可以幫你做</h3>
          <ul class="rows">
            <li>農業紀實與人物訪談<span>YouTube 3–12 分鐘</span></li>
            <li>社群短影音<span>Reels · Shorts · 9:16</span></li>
            <li>品牌形象影片<span>企劃 · 拍攝 · 剪接</span></li>
            <li>活動紀錄<span>影片 · 平面攝影</span></li>
            <li>空拍<span>場域介紹 · 農地紀錄</span></li>
          </ul>
        </section>
        <section>
          <h3>合作流程</h3>
          <ol class="steps">
            <li><div><b>了解用途與目標</b><small>平台、素材狀況、參考風格、時程</small></div></li>
            <li><div><b>確認剪接方向</b><small>先對齊結構與版本，告訴你會怎麼剪</small></div></li>
            <li><div><b>初稿</b><small>以清楚好懂為優先，可直接使用</small></div></li>
            <li><div><b>調整修正</b><small>依清單化回饋，一次整批修正</small></div></li>
            <li><div><b>定稿輸出</b><small>依平台規格輸出並備份</small></div></li>
          </ol>
        </section>
        <section>
          <h3>聯絡</h3>
          <dl class="contact">
            ${contacts.map(([k, v, href]) => `<div class="contact-row"><dt>${k}</dt><dd><a href="${esc(href)}" target="_blank" rel="noopener">${esc(v)}</a></dd><button type="button" class="copy" data-copy="${esc(k === "Email" ? v : href)}">複製</button></div>`).join("")}
          </dl>
          <p class="hint">詢問時可以附上：素材連結、用途平台、期望片長與數量、交期、參考風格 1–2 支。通常 24 小時內回覆。</p>
        </section>
      </div>
    </div>
  `;
  view.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => {
    const done = () => { b.textContent = "已複製"; setTimeout(() => (b.textContent = "複製"), 1600); };
    const fallback = () => {
      const sel = window.getSelection(), r = document.createRange();
      r.selectNodeContents(b.previousElementSibling); sel.removeAllRanges(); sel.addRange(r);
      b.textContent = "已選取";
    };
    try { navigator.clipboard.writeText(b.dataset.copy).then(done, fallback); } catch (e) { fallback(); }
  }));
}

function route() {
  const h = location.hash.slice(1);
  let page = "index";
  if (h === "about") { renderAbout(); page = "about"; }
  else if (h.startsWith("w-")) {
    const w = WORKS.find(x => x.id === h.slice(2));
    if (w) { renderWork(w); page = "work"; } else renderIndex();
  } else renderIndex();
  document.querySelectorAll("[data-nav]").forEach(a =>
    a.setAttribute("aria-current", (a.dataset.nav === page || (page === "work" && a.dataset.nav === "index")) ? "page" : "false"));
  view.style.animation = "none"; void view.offsetWidth; view.style.animation = "";
  window.scrollTo(0, 0);
}

document.getElementById("mark-initial").textContent = SITE.name.trim()[0];
document.getElementById("mark-name").textContent = SITE.name;
document.getElementById("mark-sub").textContent = SITE.sub;
document.getElementById("foot-name").textContent = `© ${new Date().getFullYear()} ${SITE.nameZh} ${SITE.name}`;

const root = document.documentElement;
try { const t = localStorage.getItem("pf-theme"); if (t) root.dataset.theme = t; } catch (e) {}
document.getElementById("theme-btn").addEventListener("click", () => {
  const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  root.dataset.theme = cur === "dark" ? "light" : "dark";
  try { localStorage.setItem("pf-theme", root.dataset.theme); } catch (e) {}
});

try { const f = sessionStorage.getItem("pf-filter"); if (f && (f === "all" || TAGS.includes(f))) filter = f; } catch (e) {}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>

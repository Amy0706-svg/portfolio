<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amy Huang 影像作品集</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Syne:wght@500;600&display=swap">
<style>
/* Layout: quiet dark gallery. Wordmark top-left, index grid of film frames, detail pages read like a production sheet. */
:root {
  --bg: #121110;
  --surface: #1b1a18;
  --fg: #ece8e1;
  --muted: #8f8a81;
  --line: #2c2a27;
  --accent: #c9a46a;
  --accent-soft: rgb(201 164 106 / .14);
  --frame-ink: #f4efe6;
  --font-display: "Syne", "Noto Sans TC", system-ui, sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --wrap: 1180px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f3f1; --surface: #e8e7e3; --fg: #171614; --muted: #6c6862;
    --line: #d9d7d2; --accent: #86652f; --accent-soft: rgb(134 101 47 / .12); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f3f1; --surface: #e8e7e3; --fg: #171614; --muted: #6c6862;
  --line: #d9d7d2; --accent: #86652f; --accent-soft: rgb(134 101 47 / .12); color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
img { max-width: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  transition: background .3s, color .3s;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 3px; }

.wrap {
  max-width: calc(var(--wrap) + 64px); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 720px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

/* header */
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 36px; }
.mark { display: flex; align-items: center; gap: 12px; }
.mark-box {
  width: 34px; height: 34px; border: 1.5px solid currentColor; border-radius: 3px;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 15px;
}
.mark-text { display: grid; line-height: 1.15; }
.mark-text strong { font-family: var(--font-display); font-weight: 500; font-size: 19px; letter-spacing: .06em; }
.mark-text small { font-size: 10px; letter-spacing: .28em; color: var(--muted); }
nav { display: flex; align-items: center; gap: 28px; font-size: 13px; letter-spacing: .12em; }
nav a { color: var(--muted); transition: color .2s; }
nav a:hover, nav a[aria-current="page"] { color: var(--fg); }
.theme-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.theme-btn:hover { color: var(--fg); }
.theme-btn svg { width: 16px; height: 16px; }
@media (max-width: 560px) { nav { gap: 18px; } .mark-text small { display: none; } }

/* page head */
.eyebrow { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); display: flex; gap: 18px; flex-wrap: wrap; }
.eyebrow b { color: var(--fg); font-weight: 500; }
.page-head { padding-block: clamp(56px, 9vw, 120px) 44px; display: grid; gap: 22px; }
h1 { font-size: clamp(24px, 3.2vw, 30px); font-weight: 500; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; max-width: 62ch; display: grid; gap: 6px; }
.lede p { margin: 0; }
.lede p:first-child { color: var(--fg); font-size: 16px; }
.list-head { display: flex; align-items: baseline; gap: 12px; border-top: 1px solid var(--line); padding-top: 28px; margin-bottom: 18px; }
.list-head h2 { margin: 0; font-size: 13px; letter-spacing: .24em; font-weight: 700; }
.list-head .tc { color: var(--muted); }
/* shots: frames the viewer can trust were shot by Amy */
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 32px 24px; }
.shots figure { margin: 0; display: grid; gap: 12px; align-content: start; }
.shots .frame.vert { max-width: 260px; }
.shots .badge.kind { font-size: 10px; }
.shots dl { margin: 0; display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 4px 14px; font-size: 13px; }
.shots dt { color: var(--muted); }
.shots dd { margin: 0; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 6px 26px; padding-bottom: 40px; font-size: 13px; letter-spacing: .06em; }
.filters button { color: var(--muted); padding-block: 4px; border-bottom: 1px solid transparent; transition: color .2s, border-color .2s; }
.filters button:hover { color: var(--fg); }
.filters button[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }
.filters .n { font-family: var(--font-mono); font-size: 11px; margin-left: 6px; color: var(--muted); }

/* grid */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 60px 44px; padding-bottom: 120px; }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 52px 28px; } }
@media (max-width: 620px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 44px; } }
.card { display: grid; gap: 16px; align-content: start; min-width: 0; }
.card .frame img { transition: transform .6s ease, filter .4s; }
.card:hover .frame img { transform: scale(1.03); filter: brightness(1.08); }
.card:hover .frame .play { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.meta-line { font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.meta-line .yr, .tc { font-family: var(--font-mono); font-size: 12px; letter-spacing: .02em; }
.card h2 { font-size: 16px; font-weight: 500; margin: 4px 0 0; line-height: 1.6; text-wrap: pretty; }
.card:hover h2 { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
.empty { color: var(--muted); padding-block: 40px 140px; }

/* frames */
.frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; background: var(--surface); }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.frame.vert { aspect-ratio: 9 / 16; }
.play {
  position: absolute; left: 50%; top: 50%; z-index: 3; width: 56px; height: 56px; border-radius: 50%;
  border: 1.5px solid var(--frame-ink); display: grid; place-items: center; color: var(--frame-ink);
  background: rgb(0 0 0 / .3); backdrop-filter: blur(3px);
  opacity: 0; transform: translate(-50%, -50%) scale(.9); transition: opacity .3s, transform .3s;
}
.play svg { width: 18px; height: 18px; margin-left: 3px; }
.badge { position: absolute; z-index: 2; font-family: var(--font-mono); font-size: 11px; color: var(--frame-ink); text-shadow: 0 1px 6px rgb(0 0 0 / .6); }
.badge.dur { right: 12px; bottom: 10px; }
.badge.kind { left: 12px; top: 10px; font-family: var(--font-body); font-size: 10px; letter-spacing: .2em; }

/* detail */
.back { display: inline-flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); letter-spacing: .06em; padding-top: 24px; }
.back:hover { color: var(--fg); }
.hero { margin-top: 28px; display: grid; gap: 12px; }
.hero .frame .play { opacity: 1; transform: translate(-50%, -50%) scale(1); width: 76px; height: 76px; }
.hero button.frame { width: 100%; padding: 0; cursor: pointer; }
.hero button.frame:hover img { filter: brightness(1.08); }
.hero iframe, .hero video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
.hero .player { background: #000; }
.hero a.frame:hover img { filter: brightness(1.08); }
.badge.yt { left: 50%; bottom: 14px; transform: translateX(-50%); font-family: var(--font-body); font-size: 12px; letter-spacing: .06em; }
.split { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 56px; align-items: start; }
.split .detail { padding-top: 28px; }
@media (max-width: 860px) { .split { grid-template-columns: minmax(0, 1fr); gap: 0; } .split .hero { max-width: 380px; width: 100%; margin-inline: auto; } .split .detail { padding-top: 44px; } }
.versions a { border-bottom: 1px solid var(--muted); }
.versions a:hover { border-color: var(--fg); }
.hero-meta { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.hero-meta a { border-bottom: 1px solid var(--muted); }
.hero-meta a:hover { color: var(--fg); border-color: var(--fg); }
.detail { display: grid; gap: 28px; padding-block: 52px 40px; max-width: 780px; }
.detail h1 { font-size: clamp(22px, 2.8vw, 28px); }
.facts { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 6px 24px; margin: 0; font-size: 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; }
.facts .tags { display: flex; gap: 14px; flex-wrap: wrap; }
.facts .tags button { border-bottom: 1px solid var(--muted); }
.facts .tags button:hover { border-color: var(--fg); }
.summary { margin: 0; max-width: 62ch; font-size: 15.5px; line-height: 1.95; }
.rights { margin: 0; font-size: 12.5px; color: var(--muted); max-width: 62ch; }
.versions { list-style: none; margin: 0; padding: 0; max-width: 780px; }
.versions li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; padding-block: 12px; border-top: 1px solid var(--line); font-size: 14px; }
.versions li:last-child { border-bottom: 1px solid var(--line); }
.versions li span:last-child { color: var(--muted); }
.block-h { margin: 0 0 16px; font-size: 13px; letter-spacing: .24em; font-weight: 700; }
.section { padding-bottom: 44px; }
.stills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.stills.vert { max-width: 760px; }
@media (max-width: 620px) { .stills:not(.vert) { grid-template-columns: minmax(0, 1fr); } .stills.vert { gap: 8px; } }
.photos { columns: 3 260px; column-gap: 16px; }
.photos .frame { break-inside: avoid; margin-bottom: 16px; aspect-ratio: auto; }
.photos .frame img { height: auto; }
.note { border-top: 1px solid var(--line); padding-top: 34px; max-width: 780px; display: grid; gap: 14px; margin-bottom: 40px; }
.note h3 { margin: 0; font-size: 13px; letter-spacing: .24em; font-weight: 700; }
.note p { margin: 0; max-width: 62ch; opacity: .9; line-height: 1.95; }
blockquote { margin: 0 0 44px; padding: 4px 0 4px 22px; border-left: 2px solid var(--accent); max-width: 760px; }
blockquote p { margin: 0; font-size: clamp(17px, 2vw, 20px); line-height: 1.8; text-wrap: pretty; }
blockquote footer { margin-top: 10px; font-size: 13px; color: var(--muted); }
.pager { border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding-block: 36px 110px; margin-top: 20px; }
.pager a { display: grid; gap: 4px; min-width: 0; }
.pager a:last-child { text-align: right; }
.pager small { font-size: 11px; letter-spacing: .22em; color: var(--muted); }
.pager span { font-size: 14px; }
.pager a:hover span { text-decoration: underline; text-underline-offset: 4px; }

/* about */
.about { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 72px; padding-bottom: 120px; }
@media (max-width: 860px) { .about { grid-template-columns: minmax(0, 1fr); gap: 48px; } }
.about .lead { font-size: clamp(20px, 2.4vw, 26px); line-height: 1.6; margin: 0; text-wrap: balance; }
.about section { display: grid; gap: 14px; }
.about section + section { margin-top: 44px; }
.about h3 { margin: 0; font-size: 11px; letter-spacing: .28em; color: var(--muted); font-weight: 500; }
.about p { margin: 0; max-width: 58ch; }
.rows { list-style: none; padding: 0; margin: 0; display: grid; }
.rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; border-top: 1px solid var(--line); padding-block: 13px; }
.rows li:last-child { border-bottom: 1px solid var(--line); }
.rows li span { color: var(--muted); font-size: 13px; text-align: right; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 8px; counter-increment: s; }
.steps li::before { content: counter(s, decimal-leading-zero); font-family: var(--font-mono); font-size: 12px; color: var(--accent); padding-top: 3px; }
.steps b { font-weight: 500; }
.steps small { display: block; color: var(--muted); font-size: 13px; }
.skills { font-size: 14px; color: var(--muted); line-height: 2; }
.contact { display: grid; margin: 0; }
.contact-row { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 10px; border-top: 1px solid var(--line); }
.contact-row:last-child { border-bottom: 1px solid var(--line); }
.contact-row dt { color: var(--muted); font-size: 13px; }
.contact-row dd { margin: 0; overflow-wrap: anywhere; }
.contact-row dd a:hover { text-decoration: underline; text-underline-offset: 4px; }
.copy { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.copy:hover { color: var(--fg); }
.hint { font-size: 13px; color: var(--muted); }

footer.site { border-top: 1px solid var(--line); }
footer.site .wrap { display: flex; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap; padding-block: 28px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }



/* ---------- header tools + menu ---------- */
.tools { display: flex; align-items: center; gap: 18px; position: relative; z-index: 60; }
.menu-btn { width: 40px; height: 40px; display: grid; place-items: center; color: inherit; }
.menu-btn svg { width: 40px; height: 40px; }
.menu-btn path { transition: transform .35s ease, opacity .25s; transform-origin: 20px 20px; }
.menu-open .menu-btn .l1 { transform: translateX(12px) rotate(45deg); }
.menu-open .menu-btn .l2 { opacity: 0; }
.menu-open .menu-btn .l3 { transform: translateX(-12px) rotate(-45deg); }
header { position: relative; z-index: 55; }
.menu-open header { color: var(--fg) !important; }
.menu-open header .mark-text small, .menu-open header .theme-btn { color: var(--muted) !important; }
.menu { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; align-items: center; animation: menuIn .35s ease both; overflow-y: auto; }
@keyframes menuIn { from { opacity: 0; } to { opacity: 1; } }
.menu-inner { width: 100%; display: grid; gap: 56px; padding-block: 140px 48px; }
.menu-links { display: grid; gap: 6px; }
.menu-links a { display: flex; align-items: baseline; gap: 22px; font-size: clamp(34px, 6vw, 64px); font-weight: 500; letter-spacing: .06em; line-height: 1.35; color: var(--muted); transition: color .2s; justify-self: start; }
.menu-links a small { font-family: var(--font-mono); font-size: 12px; color: var(--accent); letter-spacing: .1em; }
.menu-links a:hover, .menu-links a[aria-current="page"] { color: var(--fg); }
.menu-foot { display: flex; gap: 12px 28px; flex-wrap: wrap; font-size: 13px; color: var(--muted); letter-spacing: .06em; border-top: 1px solid var(--line); padding-top: 24px; }
.menu-foot a:hover { color: var(--fg); }
/* header laid over a full-bleed image (home + film pages) */
body.on-hero header { position: absolute; top: 0; left: 0; right: 0; color: #f4efe6; }
body.on-hero header .mark-text small, body.on-hero header .theme-btn { color: rgb(244 239 230 / .72); }
body.on-hero header .theme-btn:hover { color: #f4efe6; }
@media (max-width: 720px) {
  /* on phones the film frame is short, so the header sits above it instead of on it */
  body.on-cine header { position: relative; color: var(--fg); }
  body.on-cine header .mark-text small, body.on-cine header .theme-btn { color: var(--muted); }
  body.on-cine header .wrap { padding-bottom: 20px; }
}
header .wrap { padding-top: max(36px, calc(env(safe-area-inset-top, 0px) + 20px)); }
/* ---------- film page: full-bleed cinema hero ---------- */
.cine { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 92vh; background: #000; overflow: hidden; color: #f4efe6; }
.cine > img, .cine video, .cine iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.cine > img { object-fit: cover; }
.cine video { object-fit: contain; background: #000; }
.cine::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgb(0 0 0 / .45) 0%, rgb(0 0 0 / 0) 26%, rgb(0 0 0 / 0) 74%, rgb(0 0 0 / .35) 100%); transition: opacity .3s; }
.cine.playing::after { opacity: 0; }
.cine-play { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; width: 100%; color: inherit; }
.cine-play .play { position: static; opacity: 1; transform: none; width: 86px; height: 86px; transition: transform .3s, background .3s; }
.cine-play:hover .play { transform: scale(1.06); background: rgb(0 0 0 / .45); }
.cine-play .play svg { width: 22px; height: 22px; }
.cine .badge.dur { z-index: 3; right: max(24px, env(safe-area-inset-right, 0px)); bottom: 22px; font-size: 13px; }
.cine .badge.yt { z-index: 3; bottom: 22px; }
@media (max-width: 720px) { .cine-play .play { width: 64px; height: 64px; } .cine .badge.dur { right: 16px; bottom: 12px; } }
.crumb { display: flex; gap: 18px; flex-wrap: wrap; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
.crumb a:hover { color: var(--fg); }
.crumb b { color: var(--fg); font-weight: 500; }
.cine-page .detail { padding-top: 64px; }
.vcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 420px)); gap: 28px; }
.vcard { display: grid; gap: 10px; align-content: start; }
.vcard .frame img { transition: filter .3s; }
.vcard:hover .frame img { filter: brightness(1.1); }
.vcard .play { opacity: 1; transform: translate(-50%, -50%) scale(.82); }
.vcard figcaption { display: flex; gap: 12px; font-size: 13px; color: var(--muted); }
.vcard:hover figcaption span:first-child { color: var(--fg); }


/* ---------- about (reference layout) ---------- */
.tabs { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-top: 10px; font-size: 13px; letter-spacing: .08em; }
.tabs button { color: var(--muted); padding-block: 4px; border-bottom: 1px solid transparent; }
.tabs button:hover { color: var(--fg); border-color: var(--accent); }
.ab { padding-bottom: 120px; }
.ab-row { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 16px 48px; padding-block: 44px; border-top: 1px solid var(--line); scroll-margin-top: 24px; }
.ab-row h2 { margin: 0; font-size: 13px; letter-spacing: .24em; font-weight: 700; padding-top: 4px; }
.ab-body { display: grid; gap: 16px; max-width: 62ch; }
.ab-body p { margin: 0; line-height: 1.95; }
@media (max-width: 720px) { .ab-row { grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 36px; } }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; max-width: 720px; }
.timeline li { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 20px; padding-block: 12px; border-bottom: 1px dashed var(--line); }
.timeline li:first-child { padding-top: 0; }
.timeline li:last-child { border-bottom: 0; }
.timeline .tc { color: var(--accent); font-size: 13px; padding-top: 3px; }
.timeline p { margin: 0; line-height: 1.85; }
.pull { font-size: clamp(20px, 2.4vw, 26px) !important; line-height: 1.6 !important; text-wrap: balance; }
.person { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.person b { font-size: 18px; font-weight: 500; }
.person span { color: var(--muted); font-size: 13px; }
.ab .skills { font-size: 13.5px; color: var(--muted); line-height: 2; }
.kv { list-style: none; margin: 0; padding: 0; display: grid; max-width: 720px; }
.kv li { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 20px; padding-block: 12px; border-bottom: 1px dashed var(--line); }
.kv li:first-child { padding-top: 0; }
.kv li:last-child { border-bottom: 0; }
.kv b { font-weight: 500; }
.kv span { color: var(--muted); }
@media (max-width: 480px) { .kv li, .timeline li { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.ab .contact { max-width: 560px; }


/* ---------- AI workflow + notes ---------- */
.ab-row h2 .tc { color: var(--accent); font-weight: 400; margin-right: 6px; letter-spacing: .04em; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.legend .tc { margin-right: 14px; }
.chip { display: inline-grid; place-items: center; min-width: 3.4em; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; letter-spacing: .08em; border: 1px solid currentColor; white-space: nowrap; }
.chip.ai { color: var(--accent); }
.chip.tpl { color: var(--fg); opacity: .75; border-style: dashed; }
.chip.hand { color: var(--muted); }

    const p = v.play(); if (p && p.catch) p.catch(() => {});
    const pad = n => String(n).padStart(2, "0");
    const tick = () => {
      if (!document.body.contains(v)) return;
      const t = v.currentTime || 0;
      tc.textContent = `00:00:${pad(Math.floor(t))}:${pad(Math.floor((t % 1) * 25))}`;
      tcRaf = requestAnimationFrame(tick);
    };
    cancelAnimationFrame(tcRaf); tick();
  }
}

function renderIndex() {

    </div>
    <div class="filters" role="group" aria-label="依分類篩選作品">

        const n = k === "all" ? WORKS.length : WORKS.filter(w => (w.tags || []).includes(k)).length;

}

function setFilter(f, go) {
  filter = f;
  try { sessionStorage.setItem("pf-filter", filter); } catch (e) {}
  if (go && location.hash !== "#works") { location.hash = "works"; } else { renderIndex(); }
}

const KIND = { "活動紀錄": "EVENT FILM", "品牌形象": "BRAND FILM", "農業紀實": "DOCUMENTARY", "人物訪談": "INTERVIEW", "短影音": "SHORT-FORM", "空拍": "AERIAL", "攝影": "PHOTOGRAPHY" };
const isCine = w => w.type === "video" && !w.vertical && (w.video || w.youtube);

function renderWork(w) {
  const list = sorted();
  const i = list.indexOf(w);
  const prev = list[i - 1], next = list[i + 1];
  const vid = w.type === "video";

  let hero = "";
  const durMeta = w.duration ? `<span>片長 <span class="tc">${esc(w.duration)}</span></span>` : "<span></span>";
  if (vid && w.video) {
    hero = `<div class="frame player${w.vertical ? " vert" : ""}">
        <video controls playsinline preload="metadata" poster="${esc(w.poster || w.cover)}"><source src="${esc(w.video)}" type="video/mp4">你的瀏覽器無法播放這支影片。</video>
      </div>
      <div class="hero-meta">${durMeta}</div>`;
  } else if (vid && w.youtube) {
    const ytUrl = `https://www.youtube.com/watch?v=${esc(w.youtube)}`;
    hero = (CAN_EMBED
      ? `<button type="button" class="frame" id="yt-play" aria-label="播放影片"><img src="${esc(w.cover)}" alt="${esc(w.title)}"><span class="play">${PLAY}</span></button>`
      : `<a class="frame" href="${ytUrl}" target="_blank" rel="noopener" aria-label="在 YouTube 播放"><img src="${esc(w.cover)}" alt="${esc(w.title)}"><span class="play">${PLAY}</span><span class="badge yt">在 YouTube 播放 ↗</span></a>`)
      + `<div class="hero-meta">${durMeta}<a href="${ytUrl}" target="_blank" rel="noopener">在 YouTube 觀看 ↗</a></div>`;
  }

  const facts = [
    ["年份", w.year ? `<span class="tc">${w.year}</span>` : ""],
    ["委託／單位", esc(w.client)],
    ["我負責", esc(w.role)],
    ["規格", w.spec ? `<span class="tc">${esc(w.spec)}</span>` : ""],
    ["片長", vid && w.duration ? `<span class="tc">${esc(w.duration)}</span>` : ""],
    ["張數", !vid && w.images ? `<span class="tc">${w.images.length}</span> 張精選` : ""]
  ].filter(f => f[1]);

  const stills = w.stills ? `<div class="section"><h3 class="block-h">畫面</h3>
      <div class="stills${w.stillsVertical ? " vert" : ""}">${w.stills.map(s =>
        `<div class="frame${w.stillsVertical ? " vert" : ""}"><img src="${esc(s)}" alt="" loading="lazy"></div>`).join("")}</div></div>` : "";

  const photos = !vid && w.images ? `<div class="section photos">${w.images.map((s, k) =>
      `<div class="frame"><img src="${esc(s)}" alt="${esc(w.title)} ${k + 1}" loading="lazy"></div>`).join("")}</div>` : "";

  const linked = (w.versions || []).filter(v => v[2] && WORKS.find(x => x.id === v[2]));
  const plain = (w.versions || []).filter(v => !linked.includes(v));
  const versions = w.versions ? `<div class="section"><h3 class="block-h">${w.vertical ? "其他版本" : "交付版本"}</h3>
      ${linked.length ? `<div class="vcards">${linked.map(([l, d, id]) => { const x = WORKS.find(y => y.id === id);
        return `<a class="vcard" href="#w-${esc(id)}"><div class="frame"><img src="${esc(x.cover)}" alt="" loading="lazy"><span class="play">${PLAY}</span></div><figcaption><span>${esc(l)}</span><span class="tc">${esc(d)}</span></figcaption></a>`; }).join("")}</div>` : ""}
      ${plain.length ? `<ul class="versions"${linked.length ? ' style="margin-top:24px"' : ""}>${plain.map(([l, d]) => `<li><span>${esc(l)}</span><span class="tc">${esc(d)}</span></li>`).join("")}</ul>` : ""}
    </div>` : "";
  const cine = isCine(w);
  let cineHtml = "";
  if (cine) {
    const ytUrl = w.youtube ? `https://www.youtube.com/watch?v=${esc(w.youtube)}` : "";
    const btn = (w.video || CAN_EMBED)
      ? `<button type="button" class="cine-play" id="cine-play" aria-label="播放影片"><span class="play">${PLAY}</span></button>`
      : `<a class="cine-play" href="${ytUrl}" target="_blank" rel="noopener" aria-label="在 YouTube 播放"><span class="play">${PLAY}</span></a><span class="badge yt">在 YouTube 播放 ↗</span>`;

  }
  const kind = KIND[(w.tags || [])[0]] || (vid ? "FILM" : "PHOTOGRAPHY");

  view.innerHTML = `
    ${cineHtml}
    <div class="wrap${cine ? " cine-page" : ""}">
    ${cine ? "" : `<div style="height:clamp(24px,5vw,56px)"></div>`}
    <div class="${w.vertical ? "split" : ""}">
    ${!cine && hero ? `<div class="hero">${hero}</div>` : ""}
    <article class="detail">
      <div class="crumb"><a href="#works">← 全部作品</a><b>${kind}</b>${w.year ? `<span>${w.year}</span>` : ""}</div>
      <h1>${esc(w.title)}</h1>
      <dl class="facts">
        ${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}
        <dt>分類</dt><dd class="tags">${(w.tags || []).map(t => `<button type="button" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}</dd>
      </dl>
      <p class="summary">${esc(w.summary)}</p>
      ${w.rights ? `<p class="rights">${esc(w.rights)}</p>` : ""}
    </article>
    </div>
    ${w.quote ? `<blockquote><p>「${esc(w.quote.text)}」</p><footer>${esc(w.quote.by)}</footer></blockquote>` : ""}
    ${photos}
    ${versions}
    ${stills}
    ${w.shots && w.shots.length ? `<div class="section"><h3 class="block-h">拍攝現場｜我拍的鏡頭</h3><div class="shots">${w.shots.map(sh => `<figure>
        <div class="frame${sh.vertical ? " vert" : ""}"><img src="${esc(sh.src)}" alt="${esc(sh.label || "拍攝影格")}" loading="lazy"><span class="badge kind">${sh.bts ? "幕後" : "我拍的鏡頭"}</span></div>
        <dl>${[["鏡頭", sh.label], ["器材", sh.gear], ["鏡位・光線", sh.setup], ["現場限制", sh.challenge], ["怎麼處理", sh.solution]].filter(r => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      </figure>`).join("")}</div></div>` : ""}
    ${(w.notes || []).map(n => `<section class="note"><h3>${esc(n.h)}</h3>${n.p.map(p => `<p>${esc(p)}</p>`).join("")}</section>`).join("")}
    <nav class="pager" aria-label="上一件與下一件作品">
      ${prev ? `<a href="#w-${esc(prev.id)}"><small>上一件</small><span>${esc(prev.title)}</span></a>` : "<span></span>"}
      ${next ? `<a href="#w-${esc(next.id)}"><small>下一件</small><span>${esc(next.title)}</span></a>` : "<span></span>"}
    </nav>
    </div>
  `;
  const cp = document.getElementById("cine-play");
  if (cp) cp.addEventListener("click", () => {
    const box = document.getElementById("cine");
    box.classList.add("playing");
    box.innerHTML = w.video
      ? `<video controls autoplay playsinline poster="${esc(w.poster || w.cover)}"><source src="${esc(w.video)}" type="video/mp4"></video>`
      : `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(w.youtube)}?autoplay=1&rel=0" title="${esc(w.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    const v = box.querySelector("video"); if (v) { const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); }
  });
  const yt = document.getElementById("yt-play");
  if (yt) yt.addEventListener("click", () => {
    const box = document.createElement("div");
    box.className = "frame";
    box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(w.youtube)}?autoplay=1&rel=0" title="${esc(w.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    yt.replaceWith(box);
  });
  view.querySelectorAll("[data-tag]").forEach(b => b.addEventListener("click", () => setFilter(b.dataset.tag, true)));
}

const TAG_LABEL = { ai: "AI", tpl: "模板", hand: "人工" };

function renderAI() {
  const all = AI_PAGE.flows.flatMap(f => f.steps);

  const pct = t => (n(t) / all.length * 100).toFixed(1);

      <div class="bar-legend">${["ai", "tpl", "hand"].map(t => `<div><span class="sw ${t}"></span><b>${TAG_LABEL[t]}</b><span class="tc">${n(t)} 步</span><span class="tc pc">${Math.round(pct(t))}%</span></div>`).join("")}</div>
      <p class="bar-note">${AI_PAGE.flows.length} 個流程、共 ${all.length} 個步驟。紅色播放頭掃到哪一步，就看那一步由誰負責。</p>

    ${AI_PAGE.flows.map((f, i) => `<section class="flow-sec">
      <header class="flow-head">
        <span class="tc track-no">TRACK ${String(i + 1).padStart(2, "0")}</span>
        <h2>${esc(f.title)}</h2>
        <p>${esc(f.note)}</p>
      </header>
      <div class="track" data-track>
        <div class="lane-label" aria-hidden="true"><span>V${i + 1}</span></div>
        <ol class="clips" style="--n:${f.steps.length}">
          ${f.steps.map(([t, txt], k) => `<li class="clip ${t}"><span class="clip-top"><span class="tc">${String(k + 1).padStart(2, "0")}</span><span class="chip ${t}">${TAG_LABEL[t]}</span></span><span class="clip-txt">${esc(txt)}</span></li>`).join("")}
          <li class="playhead" aria-hidden="true"><i></i></li>
        </ol>
      </div>
    </section>`).join("")}
    <section class="rules">
      <div class="sec-head"><h2>我的原則</h2></div>
      <div class="rule-grid">${AI_PAGE.rules.map(([k, v], i) => `<div class="rule"><span class="tc">${String(i + 1).padStart(2, "0")}</span><b>${esc(k)}</b><p>${esc(v)}</p></div>`).join("")}</div>

}

/* playhead that sweeps each track like an edit timeline; pauses off-screen and for reduced motion */
var trackRaf = 0, trackIO = null;
function startTracks() {
  cancelAnimationFrame(trackRaf);
  if (trackIO) trackIO.disconnect();
  const tracks = [...document.querySelectorAll("[data-track]")];
  if (!tracks.length || matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return;
  const STEP = 1300, HOLD = 1400;
  const state = new Map(tracks.map(t => [t, { visible: false, t0: 0, last: -2 }]));
  trackIO = new IntersectionObserver(es => es.forEach(e => {
    const st = state.get(e.target);
    if (e.isIntersecting && !st.visible) st.t0 = performance.now();
    st.visible = e.isIntersecting;
  }), { threshold: 0.35 });
  tracks.forEach(t => { t.classList.add("live"); trackIO.observe(t); });
  const tick = now => {
    if (!tracks[0].isConnected) { trackIO.disconnect(); return; }
    state.forEach((st, el) => {
      if (!st.visible) return;
      const box = el.querySelector(".clips"), clips = box.querySelectorAll(".clip"), ph = box.querySelector(".playhead");
      const n = clips.length, run = n * STEP, cyc = run + HOLD;
      const t = (now - st.t0) % cyc, p = Math.min(t / run, 1);
      const vertical = getComputedStyle(box).getPropertyValue("--dir").trim() === "v";
      const pad = 14;
      ph.style.transform = vertical ? `translateY(${p * (box.clientHeight - pad * 2)}px)` : `translateX(${p * (box.clientWidth - pad * 2)}px)`;
      const idx = p < 1 ? Math.floor(p * n) : n;
      if (idx !== st.last) {
        clips.forEach((c, k) => { c.classList.toggle("on", k === idx); c.classList.toggle("done", k < idx); });
        st.last = idx;
      }
    });
    trackRaf = requestAnimationFrame(tick);
  };
  trackRaf = requestAnimationFrame(tick);
}

function route() {
  const h = location.hash.slice(1);
  let page = "home";
  cancelAnimationFrame(tcRaf); if (typeof trackRaf !== "undefined") { cancelAnimationFrame(trackRaf); if (trackIO) trackIO.disconnect(); }
  if (h === "about") { renderAbout(); page = "about"; }
  else if (h === "ai") { renderAI(); page = "ai"; }
  else if (h === "notes") { renderNotes(); page = "notes"; }
  else if (h === "works") { renderIndex(); page = "index"; }
  else if (h.startsWith("w-")) {
    const w = WORKS.find(x => x.id === h.slice(2));
    if (w) { renderWork(w); page = "work"; } else renderHome();
  } else renderHome();
  const curWork = page === "work" ? WORKS.find(x => x.id === h.slice(2)) : null;
  const full = page === "home" || page === "work";
  view.className = page === "home" ? "home" : (full ? "" : "wrap");
  document.body.classList.toggle("on-hero", page === "home" || !!(curWork && isCine(curWork)));
  document.body.classList.toggle("on-cine", !!(curWork && isCine(curWork)));
  closeMenu();
  document.querySelectorAll("[data-nav]").forEach(a =>
    a.setAttribute("aria-current", (a.dataset.nav === page || (page === "work" && a.dataset.nav === "index")) ? "page" : "false"));
  view.style.animation = "none"; void view.offsetWidth; view.style.animation = "";
  window.scrollTo(0, 0);
}

const menu = document.getElementById("menu"), menuBtn = document.getElementById("menu-btn");
document.getElementById("menu-foot").innerHTML = `<a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a><a href="${esc(SITE.instagram.url)}" target="_blank" rel="noopener">Instagram ↗</a><a href="${esc(SITE.youtube.url)}" target="_blank" rel="noopener">YouTube ↗</a>`;
function closeMenu() {
  if (menu.hidden) return;
  menu.hidden = true; document.body.classList.remove("menu-open");
  menuBtn.setAttribute("aria-expanded", "false"); menuBtn.setAttribute("aria-label", "開啟選單");
}
menuBtn.addEventListener("click", () => {
  if (!menu.hidden) { closeMenu(); return; }
  menu.hidden = false; document.body.classList.add("menu-open");
  menuBtn.setAttribute("aria-expanded", "true"); menuBtn.setAttribute("aria-label", "關閉選單");
  const first = menu.querySelector("a"); if (first) first.focus();
});
menu.querySelectorAll("a[href^='#']").forEach(a => a.addEventListener("click", () => {
  if (a.getAttribute("href") === location.hash || (a.getAttribute("href") === "#" && !location.hash)) closeMenu();
}));
addEventListener("keydown", e => { if (e.key === "Escape") { closeMenu(); menuBtn.focus(); } });
